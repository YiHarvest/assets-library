<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">视频分析入库流水线</title>
  <desc id="description">视频通过上传、四路分镜队列、八路分片处理、八路对象上传、事务入库及四路视觉分析的流程</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FDFA"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5 0 9z" fill="#0E7490"/>
    </marker>
    <style>
      .flow { stroke-dasharray: 8 8; animation: move 1.2s linear infinite; }
      @keyframes move { to { stroke-dashoffset: -32; } }
    </style>
  </defs>

  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <path d="M55 110H1145M55 390H1145" stroke="#CBD5E1" stroke-width="1"/>
  <text x="60" y="58" fill="#0F172A" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="750">视频分析入库流水线</text>
  <text x="60" y="87" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14">有界并发 · 异步状态 · 整批补偿 · 失败回退</text>

  <g fill="none" stroke="#0E7490" stroke-width="2.2" marker-end="url(#arrow)" class="flow">
    <path d="M188 247H225"/>
    <path d="M363 247H400"/>
    <path d="M538 247H575"/>
    <path d="M713 247H750"/>
    <path d="M888 247H925"/>
    <path d="M1063 247H1100"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" filter="url(#shadow)">
    <g transform="translate(50 190)">
      <rect width="138" height="114" rx="20" fill="url(#node)" stroke="#99F6E4"/>
      <circle cx="69" cy="39" r="20" fill="#CCFBF1"/>
      <path d="M69 25v27m-10-10 10 10 10-10" fill="none" stroke="#0F766E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="69" y="79" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">流式上传</text>
      <text x="69" y="99" text-anchor="middle" fill="#64748B" font-size="11">staging + 校验</text>
    </g>

    <g transform="translate(225 172)">
      <rect width="138" height="150" rx="20" fill="url(#hot)"/>
      <text x="69" y="35" text-anchor="middle" fill="#ECFEFF" font-size="15" font-weight="700">异步分镜</text>
      <text x="69" y="56" text-anchor="middle" fill="#A5F3FC" font-size="11">QUEUE WORKERS</text>
      <g fill="#FFFFFF" fill-opacity="0.16" stroke="#BAE6FD" stroke-opacity="0.6">
        <rect x="18" y="73" width="42" height="25" rx="8"/><rect x="78" y="73" width="42" height="25" rx="8"/>
        <rect x="18" y="108" width="42" height="25" rx="8"/><rect x="78" y="108" width="42" height="25" rx="8"/>
      </g>
      <g fill="#F0FDFA" font-size="11" text-anchor="middle"><text x="39" y="90">W1</text><text x="99" y="90">W2</text><text x="39" y="125">W3</text><text x="99" y="125">W4</text></g>
    </g>

    <g transform="translate(400 190)">
      <rect width="138" height="114" rx="20" fill="url(#node)" stroke="#7DD3FC"/>
      <circle cx="69" cy="39" r="20" fill="#E0F2FE"/>
      <path d="M58 32h22M58 39h22M58 46h22" stroke="#0284C7" stroke-width="3" stroke-linecap="round"/>
      <text x="69" y="79" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">分片准备</text>
      <text x="69" y="99" text-anchor="middle" fill="#0369A1" font-size="11" font-weight="700">8× 并发</text>
    </g>

    <g transform="translate(575 190)">
      <rect width="138" height="114" rx="20" fill="url(#node)" stroke="#7DD3FC"/>
      <circle cx="69" cy="39" r="20" fill="#E0F2FE"/>
      <path d="M55 45h28l-4-14H59zM62 49v4h14v-4" fill="none" stroke="#0284C7" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="69" y="79" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">ZOS 上传</text>
      <text x="69" y="99" text-anchor="middle" fill="#0369A1" font-size="11" font-weight="700">8× 并发</text>
    </g>

    <g transform="translate(750 190)">
      <rect width="138" height="114" rx="20" fill="url(#node)" stroke="#C4B5FD"/>
      <circle cx="69" cy="39" r="20" fill="#EDE9FE"/>
      <ellipse cx="69" cy="32" rx="12" ry="5" fill="none" stroke="#7C3AED" stroke-width="2"/>
      <path d="M57 32v15c0 3 5 5 12 5s12-2 12-5V32M57 40c0 3 5 5 12 5s12-2 12-5" fill="none" stroke="#7C3AED" stroke-width="2"/>
      <text x="69" y="79" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="700">事务入库</text>
      <text x="69" y="99" text-anchor="middle" fill="#6D28D9" font-size="11">MySQL + Saga</text>
    </g>

    <g transform="translate(925 172)">
      <rect width="138" height="150" rx="20" fill="url(#hot)"/>
      <text x="69" y="35" text-anchor="middle" fill="#ECFEFF" font-size="15" font-weight="700">VLM 分析</text>
      <text x="69" y="56" text-anchor="middle" fill="#A5F3FC" font-size="11">APP WORKERS</text>
      <g fill="#FFFFFF" fill-opacity="0.16" stroke="#A5F3FC" stroke-opacity="0.6">
        <circle cx="39" cy="85" r="13"/><circle cx="99" cy="85" r="13"/>
        <circle cx="39" cy="120" r="13"/><circle cx="99" cy="120" r="13"/>
      </g>
      <g fill="#F0FDFA" font-size="10" text-anchor="middle"><text x="39" y="89">1</text><text x="99" y="89">2</text><text x="39" y="124">3</text><text x="99" y="124">4</text></g>
    </g>

    <g transform="translate(1100 190)">
      <rect width="70" height="114" rx="20" fill="#0F172A"/>
      <circle cx="35" cy="38" r="18" fill="#164E63"/>
      <path d="M27 38h16M35 30v16" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round"/>
      <text x="35" y="76" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">语义</text>
      <text x="35" y="94" text-anchor="middle" fill="#A5F3FC" font-size="12" font-weight="700">检索</text>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <rect x="225" y="345" width="663" height="54" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="255" cy="372" r="9" fill="#14B8A6"/>
    <text x="275" y="377" fill="#334155" font-size="13">任一步失败：等待在途上传结束 → 删除已上传对象 → 回滚整批数据库可见性</text>
    <rect x="925" y="345" width="245" height="54" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="955" cy="372" r="9" fill="#38BDF8"/>
    <text x="975" y="377" fill="#334155" font-size="13">CUDA/NVENC → CPU 回退</text>
  </g>

  <text x="60" y="455" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12">POST 202 + GET polling · queue capacity 20 · retry 1 · crash recovery · SKIP LOCKED</text>
</svg>
