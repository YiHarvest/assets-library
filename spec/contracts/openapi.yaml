          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/TagInput" }
    AssetQuery:
      type: object
      additionalProperties: false
      description: 同时覆盖无 query 的浏览和有 query 的语义检索。
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 1000
          description: 可选自然语言语义查询。
        keywords:
          type: array
          maxItems: 10
          items: { type: string, minLength: 1, maxLength: 64 }
        filter:
          $ref: "#/components/schemas/AssetQueryFilter"
