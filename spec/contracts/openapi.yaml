        limit: { type: integer, minimum: 1, maximum: 100, default: 20 }
        include_tag_statistics: { type: boolean, default: true }

    AssetSummary:
      type: object
      description: 查询结果中的素材摘要；视频项代表一个分镜切片。
      required:
        - asset_id
        - parent_video_id
        - segment_index
        - user_id
        - name
        - description
        - media_type
        - status
        - review_status
        - tags
        - media_url
        - created_at
        - updated_at
      properties:
        asset_id: { type: string, format: uuid }
        parent_video_id:
          description: 视频切片所属父视频；图片为 null。
          oneOf: [{ type: string, format: uuid }, { type: "null" }]
        segment_index:
          description: 子视频在父视频中的零基序号；图片为 null。
          oneOf: [{ type: integer, minimum: 0 }, { type: "null" }]
        user_id:
          oneOf:
            - { $ref: "#/components/schemas/UserId" }
            - { type: "null" }
        name: { type: string }
        description: { type: string }
        media_type: { $ref: "#/components/schemas/MediaType" }
        status: { $ref: "#/components/schemas/TaskStatusValue" }
        review_status: { $ref: "#/components/schemas/ReviewStatus" }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        media_url:
          type: string
          description: 已带必要 user_id 作用域的媒体读取相对 URL。
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        search_score:
          type: number
          minimum: 0
          maximum: 1
          description: 最终排序分；仅检索结果出现，且仅超过 search.threshold 的素材会返回。
        keyword_score:
          type: number
          minimum: 0
          maximum: 1
          description: 关键词匹配分；语义-only 结果可以省略。
        semantic_score:
          type: number
          minimum: 0
          maximum: 1
          description: 语义相似度；关键词-only 结果可以省略。
        match_type:
          type: string
          enum: [exact, alias, prefix, contains, typo, semantic, hybrid]
          description: 生成最终分数的主要匹配方式。
        matched_terms:
          type: array
          items: { type: string }
          description: 实际命中的规范化查询词。
        matched_categories:
          type: array
          items: { type: string }
          description: 命中标签所属分类，例如 scene、style 或 form。
    AssetSearchMeta:
      type: object
      additionalProperties: false
      required: [mode, threshold, max_score, reason, message]
      description: 本次检索的阈值和结果说明；普通浏览时响应中的 search 为 null。
      properties:
        mode:
          type: string
          enum: [keyword, semantic, hybrid]
        threshold:
          type: number
          minimum: 0
          maximum: 1
          description: 本次最终展示阈值；结果必须严格大于该值。
        max_score:
          description: 阈值过滤前的最高候选分；没有候选或语义服务不可用时为 null。
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: "null" }
        reason:
          type: string
          enum:
            - matched
            - no_candidates
            - below_threshold
            - semantic_unavailable
            - fallback_exhausted
        message:
          description: matched 时为 null；空结果或服务不可用时提供可直接展示的说明。
          oneOf:
            - { type: string }
            - { type: "null" }
