          properties:
            mode: { type: string, const: exclude_user }
            user_id: { $ref: "#/components/schemas/UserId" }
    AssetQueryFilter:
      type: object
      additionalProperties: false
      description: 所有字段按 AND 组合；user_scope 缺省时只查询公共素材。
      properties:
        user_scope:
          $ref: "#/components/schemas/UserScope"
          default: { mode: public }
        media_types:
          type: array
          maxItems: 2
          items: { $ref: "#/components/schemas/MediaType" }
        statuses:
          type: array
          maxItems: 4
