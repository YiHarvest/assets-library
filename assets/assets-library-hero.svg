<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">素材中枢</title>
  <desc id="description">多模态素材从上传、分镜、视觉理解到语义检索的品牌头图</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="20" x2="1140" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071525"/>
      <stop offset="0.55" stop-color="#0A2534"/>
      <stop offset="1" stop-color="#063E46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#94A3B8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.42"/>
    </filter>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <rect width="1200" height="420" rx="32" fill="url(#grid)"/>
  <circle cx="1020" cy="62" r="250" fill="url(#glow)"/>
  <circle cx="170" cy="420" r="210" fill="url(#glow)" opacity="0.45"/>

  <g transform="translate(74 68)" filter="url(#shadow)">
    <rect x="0" y="0" width="112" height="112" rx="28" fill="#0F2D3A" stroke="#5EEAD4" stroke-opacity="0.55"/>
    <rect x="24" y="25" width="64" height="48" rx="10" fill="none" stroke="url(#accent)" stroke-width="5"/>
    <path d="M31 64l15-15 12 11 10-9 14 13" fill="none" stroke="#A7F3D0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="70" cy="40" r="5" fill="#67E8F9"/>
    <path d="M44 88h42" stroke="#38BDF8" stroke-width="5" stroke-linecap="round"/>
    <path d="M26 88h5" stroke="#5EEAD4" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="220" y="112" fill="#5EEAD4" font-size="17" font-weight="700" letter-spacing="4">MULTIMODAL ASSET HUB</text>
    <text x="220" y="177" fill="#F8FAFC" font-size="54" font-weight="750" letter-spacing="2">素材中枢</text>
    <text x="220" y="219" fill="#B6D6DF" font-size="20">从媒体上传到分镜、理解、入库与语义检索</text>
  </g>

  <g transform="translate(220 262)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">
    <g><rect width="112" height="38" rx="19" fill="#123B47" stroke="#5EEAD4" stroke-opacity="0.34"/><text x="56" y="24" fill="#CCFBF1" text-anchor="middle">流式上传</text></g>
    <g transform="translate(126)"><rect width="112" height="38" rx="19" fill="#123B47" stroke="#5EEAD4" stroke-opacity="0.34"/><text x="56" y="24" fill="#CCFBF1" text-anchor="middle">异步分镜</text></g>
    <g transform="translate(252)"><rect width="112" height="38" rx="19" fill="#123B47" stroke="#38BDF8" stroke-opacity="0.34"/><text x="56" y="24" fill="#E0F2FE" text-anchor="middle">视觉分析</text></g>
    <g transform="translate(378)"><rect width="112" height="38" rx="19" fill="#123B47" stroke="#38BDF8" stroke-opacity="0.34"/><text x="56" y="24" fill="#E0F2FE" text-anchor="middle">语义检索</text></g>
  </g>

  <g transform="translate(710 93)" filter="url(#shadow)" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <path d="M94 60 C160 60 152 129 212 129" fill="none" stroke="#5EEAD4" stroke-opacity="0.58" stroke-width="2" stroke-dasharray="6 7"/>
    <path d="M94 204 C160 204 152 129 212 129" fill="none" stroke="#38BDF8" stroke-opacity="0.58" stroke-width="2" stroke-dasharray="6 7"/>
    <path d="M292 129 C332 129 332 190 372 190" fill="none" stroke="#67E8F9" stroke-opacity="0.7" stroke-width="2"/>

    <g transform="translate(0 18)">
      <rect width="94" height="84" rx="18" fill="#102F3B" stroke="#5EEAD4" stroke-opacity="0.6"/>
      <rect x="20" y="19" width="54" height="38" rx="7" fill="#164E63"/>
      <path d="M24 51l13-12 10 9 8-7 15 10" fill="none" stroke="#A7F3D0" stroke-width="3"/>
      <text x="47" y="73" fill="#CCFBF1" font-size="11" text-anchor="middle">IMAGE</text>
    </g>
    <g transform="translate(0 162)">
      <rect width="94" height="84" rx="18" fill="#102F3B" stroke="#38BDF8" stroke-opacity="0.6"/>
      <rect x="20" y="18" width="54" height="40" rx="7" fill="#0C4A6E"/>
      <path d="M42 29l17 9-17 9z" fill="#BAE6FD"/>
      <text x="47" y="73" fill="#E0F2FE" font-size="11" text-anchor="middle">VIDEO</text>
    </g>
    <g transform="translate(212 86)">
      <circle cx="40" cy="40" r="40" fill="#0E7490" stroke="#67E8F9" stroke-width="2" filter="url(#softGlow)"/>
      <path d="M24 40h32M40 24v32M29 29l22 22M51 29L29 51" stroke="#ECFEFF" stroke-width="3" stroke-linecap="round"/>
      <text x="40" y="102" fill="#A5F3FC" font-size="12" text-anchor="middle" font-weight="700">AI PIPELINE</text>
    </g>
    <g transform="translate(372 148)">
      <rect width="92" height="84" rx="18" fill="#102F3B" stroke="#67E8F9" stroke-opacity="0.62"/>
      <ellipse cx="46" cy="24" rx="26" ry="10" fill="#155E75" stroke="#A5F3FC"/>
      <path d="M20 24v30c0 6 12 10 26 10s26-4 26-10V24" fill="#155E75" stroke="#A5F3FC"/>
      <path d="M20 39c0 6 12 10 26 10s26-4 26-10" fill="none" stroke="#A5F3FC"/>
      <text x="46" y="77" fill="#CFFAFE" font-size="10" text-anchor="middle">SEARCH</text>
    </g>
  </g>

  <text x="74" y="380" fill="#7096A3" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" letter-spacing="1.4">RELIABLE JOBS · PRIVATE STORAGE · GPU ACCELERATION · SEMANTIC SEARCH</text>
</svg>
