            discriminator: { propertyName: media_type }
        next_cursor:
          oneOf: [{ type: string }, { type: "null" }]
        has_more: { type: boolean }

    ImageAnalysis:
      type: object
      additionalProperties: false
      description: 图片 VLM 分析结果；API v1 嵌套字段均为 snake_case。
      required: [kind, description, tags, ocr]
      properties:
        kind: { type: string, const: image }
        description: { type: string, minLength: 1 }
        tags:
          type: object
          required: [scene, object, person, style, color_composition]
          properties:
            scene: { type: array, items: { type: string } }
            object: { type: array, items: { type: string } }
            person: { type: array, items: { type: string } }
            style: { type: array, items: { type: string } }
            color_composition: { type: array, items: { type: string } }
        ocr:
          type: object
          required: [text, unavailable_reason]
          properties:
            text: { oneOf: [{ type: string }, { type: "null" }] }
            unavailable_reason: { oneOf: [{ type: string }, { type: "null" }] }
    TimedSummary:
      type: object
      required: [start_seconds, end_seconds, summary]
      properties:
        start_seconds: { type: number, minimum: 0 }
        end_seconds: { type: number, minimum: 0 }
        summary: { type: string, minLength: 1 }
    VideoAnalysis:
      type: object
      additionalProperties: false
      description: 一个子视频切片的关键帧 VLM 分析结果。
      required: [kind, description, topics, tags, visual_segments, key_moments, timeline]
      properties:
        kind: { type: string, const: video }
        description: { type: string, minLength: 1 }
        topics: { type: array, items: { type: string } }
        tags:
          type: object
          required: [scene, person, form]
          properties:
            scene: { type: array, items: { type: string } }
            person: { type: array, items: { type: string } }
            form: { type: array, items: { type: string } }
        visual_segments:
          type: array
          items: { $ref: "#/components/schemas/TimedSummary" }
        key_moments:
          type: array
          items:
            type: object
            required: [seconds, summary]
            properties:
              seconds: { type: number, minimum: 0 }
              summary: { type: string, minLength: 1 }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimedSummary" }
    AssetDetail:
      description: 素材摘要、存储元数据和完整分析结果。
      unevaluatedProperties: false
      allOf:
        - { $ref: "#/components/schemas/AssetSummary" }
        - type: object
          required:
            - original_filename
            - mime_type
            - size_bytes
            - auto_publish
            - segment_start_seconds
            - segment_end_seconds
            - failure
            - analysis
          properties:
            original_filename: { type: string }
            mime_type: { type: string }
            size_bytes: { type: integer, minimum: 0 }
            auto_publish: { type: boolean }
            segment_start_seconds:
              description: 视频分镜在父视频中的绝对起始秒；图片为 null。
              oneOf: [{ type: number, minimum: 0 }, { type: "null" }]
            segment_end_seconds:
              description: 视频分镜在父视频中的绝对结束秒；图片为 null。
              oneOf: [{ type: number, minimum: 0 }, { type: "null" }]
            failure:
              oneOf:
                - { $ref: "#/components/schemas/ApiError" }
                - { type: "null" }
            analysis:
              oneOf:
                - { $ref: "#/components/schemas/ImageAnalysis" }
                - { $ref: "#/components/schemas/VideoAnalysis" }
                - { type: "null" }

    MutationContext:
      type: object
      additionalProperties: false
      description: 发布、重试和删除共享的作用域及回调字段。
      properties:
        user_id: { $ref: "#/components/schemas/NullableUserId" }
        callback_url: { $ref: "#/components/schemas/CallbackUrl" }
    UpdateAssetTask:
      type: object
      additionalProperties: false
      description: 名称、描述和人工标签必须整体提交；不能局部省略。
      required: [name, description, tags]
      properties:
        user_id: { $ref: "#/components/schemas/NullableUserId" }
        callback_url: { $ref: "#/components/schemas/CallbackUrl" }
        name: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, maxLength: 10000 }
        tags:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/TagInput" }
