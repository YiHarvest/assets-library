openapi: 3.1.0
info:
  title: 多模态素材库 API
  version: 1.0.0
  summary: 基于任务的图片与视频素材分析、存储和检索 API
  description: >-
    所有业务字段使用 snake_case。接口部署在可信内网，不做应用层鉴权。
    所有写操作异步执行，并由统一任务接口报告进度。
servers:
  - url: /
    description: 示例内网地址；部署时替换
tags:
  - name: Uploads
    description: 三步清单式流上传
  - name: Tasks
    description: 上传和素材变更的统一任务状态
  - name: Assets
    description: 素材查询和异步变更
  - name: Media
    description: 支持 Range 的媒体流
  - name: Users
    description: 用户素材空间统计和展示列表
  - name: Compatibility
    description: 旧剪辑业务兼容接口
  - name: Specification
paths:
  /api/v1/openapi:
    get:
      tags: [Specification]
      operationId: getOpenApiSpecification
      summary: 获取公开的 OpenAPI YAML
      security: []
      responses:
        "200":
          description: OpenAPI 3.1 YAML
          content:
            application/yaml:
              schema: { type: string }

  /api/v1/uploads:
    post:
      tags: [Uploads]
      operationId: createUploadTask
      summary: 创建上传任务和文件清单
      description: 每个任务最多 100 个文件，总声明大小最多 2 GiB。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUploadTask" }
            examples:
              imageAndVideo:
                value:
                  user_id: user_123
                  callback_url: null
                  auto_publish: false
                  items:
                    - filename: product.png
                      size_bytes: 182304
                      content_type: image/png
                    - filename: demo.mp4
                      size_bytes: 52428800
                      content_type: video/mp4
      callbacks:
        taskFinished:
          $ref: "#/components/callbacks/TaskFinished"
      responses:
        "201":
          description: 上传任务和 item_id 已创建
          headers:
            Location:
              schema: { type: string }
              description: 统一任务查询地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/ContentTooLarge" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/uploads/{task_id}/items/{item_id}:
    put:
      tags: [Uploads]
      operationId: uploadTaskItem
      summary: 流式写入一个上传任务文件
      description: >-
        请求体是原始文件字节，不是 multipart。实际字节数必须与清单中的
        size_bytes 完全相等；内容流式写入 media/.staging，不整体载入内存。
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/ItemId"
        - name: Content-Length
          in: header
          required: false
          description: 建议提供，并且必须与清单声明大小相等
          schema: { type: integer, minimum: 0 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
          video/mp4:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: 文件已完整接收
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/uploads/{task_id}:
    post:
      tags: [Uploads]
      operationId: sealUploadTask
      summary: 封存上传任务并启动处理
      description: >-
        所有 item 完整接收后，启动验证、正规化、视频分镜、ZOS 持久化、
        MySQL 建档及独立分析。封存后不再接受文件字节。
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "202":
          description: 任务已封存并开始处理
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/tasks/{task_id}:
    get:
      tags: [Tasks]
      operationId: getTask
      summary: 查询任意异步任务的总体和逐文件进度
      description: 统一查询 upload、update、publish、retry、delete、match 任务。
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: 当前任务快照
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/compat/segment-match:
    post:
      tags: [Compatibility]
      operationId: createCompatibilitySegmentMatch
      summary: 异步对齐 ASR/LLM 分段并匹配素材
      description: >-
        兼容两种旧剪辑业务格式：存在 ASR transcripts 时，Worker 按顺序生成
        start_time、end_time 和 group_id；ASR 为空时，直接复用 LLM segments 已有的
        时间轴字段。两种格式都复用现有描述语义匹配函数为每段选择至多一个素材。
        请求中的未知顶层字段会原样透传到终态回调。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompatibilityMatchRequest" }
      callbacks:
        matchFinished:
          '{$request.body#/callback_url}':
            post:
              requestBody:
                required: true
                content:
                  application/json:
                    schema: { $ref: "#/components/schemas/CompatibilityMatchCallback" }
              responses:
                "200": { description: 回调已接收；任意 2xx 均视为成功 }
      responses:
        "202":
          description: 匹配任务已持久化并进入队列
          headers:
            Location:
              schema: { type: string }
              description: 统一任务查询地址
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatibilityMatchAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/ContentTooLarge" }

  /api/v1/assets/query:
    post:
      tags: [Assets]
      operationId: queryAssets
      summary: 浏览或语义搜索素材
      description: >-
        统一游标分页、语义搜索、受控 filter 和标签统计。public 范围单独搜索
        AI/AIGC/人工智能宽泛别名时会扩展到公共及全部个人素材；显式用户范围不变。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssetQuery" }
            examples:
              personalImages:
                value:
                  query: 白色背景下的橙色产品静物
                  keywords: [橙子, 白色背景]
                  filter:
                    user_scope: { mode: user, user_id: user_123 }
                    media_types: [image]
                    statuses: [done]
                    review_statuses: [published]
                  cursor: null
                  limit: 20
                  include_tag_statistics: true
      responses:
        "200":
          description: 素材页及标签统计
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetQueryResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/ContentTooLarge" }

  /api/v1/assets/{asset_id}:
    parameters:
      - $ref: "#/components/parameters/AssetId"
    get:
      tags: [Assets]
      operationId: getAsset
      summary: 获取素材详情和分析结果
      parameters:
        - $ref: "#/components/parameters/OptionalUserId"
      responses:
        "200":
          description: 素材详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssetDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: 异步整体更新名称、描述和人工标签
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAssetTask" }
      callbacks:
        taskFinished:
          $ref: "#/components/callbacks/TaskFinished"
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/ContentTooLarge" }
    delete:
      tags: [Assets]
      operationId: deleteAsset
      summary: 异步删除或转公共素材
      description: >-
        非空 user_id 表示个人删除：只清空归属，使素材成为公共素材。
        user_id 为空表示公共硬删除：清理 MySQL、ZOS 和 Chroma；删除最后一个
        视频切片时同时回收父视频。
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MutationContext" }
      callbacks:
        taskFinished:
          $ref: "#/components/callbacks/TaskFinished"
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/ContentTooLarge" }

  /api/v1/users/{user_id}/storage-usage:
    get:
      tags: [Users]
      operationId: getUserStorageUsage
      summary: 统计指定用户的素材数量和存储字节
      description: >-
        直接按 MySQL 中 user_id 的素材记录聚合。video_bytes 包含视频对象和
        视频第一帧缩略图；image_bytes 只包含图片对象。
      parameters:
        - $ref: "#/components/parameters/RequiredUserId"
      responses:
        "200":
          description: 用户素材空间统计及逐素材字节明细
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserStorageUsage" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/users/{user_id}/media:
    get:
      tags: [Users]
      operationId: listUserMedia
      summary: 分页列出用户图片和视频第一帧
      description: >-
        图片返回 media_url；视频返回 thumbnail_url 和 media_url。三个 URL
        均为普通绝对直链，可直接用于 img/video 元素，不返回 base64。
      parameters:
        - $ref: "#/components/parameters/RequiredUserId"
        - name: cursor
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 2048 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: 用户媒体展示页
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserMediaList" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/assets/{asset_id}/publish:
    post:
      tags: [Assets]
      operationId: publishAsset
      summary: 异步发布已完成分析的素材
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MutationContext" }
      callbacks:
        taskFinished:
          $ref: "#/components/callbacks/TaskFinished"
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/ContentTooLarge" }

  /api/v1/assets/{asset_id}/retry:
    post:
      tags: [Assets]
      operationId: retryAsset
      summary: 异步重试分析失败的素材
      parameters:
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MutationContext" }
      callbacks:
        taskFinished:
          $ref: "#/components/callbacks/TaskFinished"
      responses:
        "202": { $ref: "#/components/responses/TaskAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/ContentTooLarge" }

  /api/v1/media/{asset_id}:
    get:
      tags: [Media]
      operationId: getMedia
      summary: 流式读取正规化后的媒体
      description: >-
        支持完整对象、开放范围和后缀范围；持久化素材直接从 ZOS 读取。
        该端点无需鉴权，user_id 仅用于限定素材范围。
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/OptionalUserId"
        - name: download
          in: query
          required: false
          description: 设为 1 时使用原始文件名作为附件下载
          schema: { type: string, enum: ["1"] }
        - name: Range
          in: header
          required: false
          description: 单段字节范围，例如 bytes=0-1023、bytes=1024- 或 bytes=-500
          schema: { type: string, pattern: '^bytes=\\d*-\\d*$' }
      responses:
        "200":
          description: 完整图片或视频
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "206":
          description: 部分媒体内容
          headers:
            Accept-Ranges: { schema: { type: string, const: bytes } }
            Content-Length: { schema: { type: integer } }
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "416":
          description: Range 语法或区间不可满足
          headers:
            Content-Range: { schema: { type: string } }

  /api/v1/media/{asset_id}/thumbnail:
    get:
      tags: [Media]
      operationId: getVideoThumbnail
      summary: 读取视频第一帧 JPEG 缩略图
      description: >-
        返回视频切片持久化的第一帧，支持 Range，无需鉴权。
      parameters:
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/OptionalUserId"
        - name: Range
          in: header
          required: false
          schema: { type: string, pattern: '^bytes=\\d*-\\d*$' }
      responses:
        "200":
          description: 完整 JPEG 首帧
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "206":
          description: 部分 JPEG 首帧
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AssetId:
      name: asset_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequiredUserId:
      name: user_id
      in: path
      required: true
      description: URL 解码后必须为 1–191 字符的非空用户标识
      schema: { $ref: "#/components/schemas/UserId" }
    OptionalUserId:
      name: user_id
      in: query
      required: false
      description: 非空时限定该用户素材；省略或空值时限定公共素材
      schema:
        oneOf:
          - { $ref: "#/components/schemas/UserId" }
          - { type: string, const: "" }

  responses:
    TaskAccepted:
      description: 异步任务已接受
      headers:
        Location:
          schema: { type: string }
          description: /api/v1/tasks/{task_id}
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaskAccepted" }
    BadRequest:
      description: 请求字段、JSON、ID 或媒体声明无效
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 跨站请求或资源作用域禁止
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 任务、item 或素材不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: 当前状态不允许该操作
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ContentTooLarge:
      description: JSON 请求体超过 1 MiB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ServiceUnavailable:
      description: 模型、分镜或基础设施尚未配置/不可用
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  callbacks:
    TaskFinished:
      '{$request.body#/callback_url}':
        post:
          summary: 任务到达 done 或 failed 后的终态通知
          description: >-
            服务端最多尝试 5 次，按指数退避重试；回调失败不会回滚已经完成的
            业务事务。接收方返回任意 2xx 即视为成功。
          parameters:
            - name: X-Assets-Task-Id
              in: header
              required: true
              schema: { type: string, format: uuid }
          requestBody:
            required: true
            content:
              application/json:
                schema: { $ref: "#/components/schemas/TaskCallback" }
          responses:
            "2XX":
              description: 回调已接收

  schemas:
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - forbidden
        - not_found
        - conflict
        - task_not_ready
        - task_expired
        - upload_incomplete
        - upload_size_mismatch
        - unsupported_media_type
        - file_too_large
        - corrupt_file
        - unsupported_video_codec
        - invalid_video_frames
        - scene_detection_failed
        - segment_too_large
        - model_not_configured
        - model_video_unsupported
        - video_frames_missing
        - model_request_failed
        - model_response_invalid
        - storage_error
        - database_error
        - callback_failed
        - service_unavailable
        - internal_error
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        item_id: { type: string, format: uuid }
        segment_index: { type: integer, minimum: 0 }
        filename: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        limit_bytes: { type: integer, minimum: 1 }
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string, minLength: 1 }
        details:
          type: array
          items: { $ref: "#/components/schemas/ErrorDetail" }
    ErrorResponse:
      type: object
      additionalProperties: false
      description: 所有 JSON 错误响应的统一结构。
      required: [error, request_id]
      properties:
        error: { $ref: "#/components/schemas/ApiError" }
        request_id:
          type: string
          format: uuid
          description: 本次请求的链路追踪 ID；也会出现在 X-Request-Id 响应头。
      example:
        error:
          code: segment_too_large
          message: 视频分镜存在超过 10 MiB 的切片。
          details:
            - item_id: 2f3270e8-c515-44cf-83aa-3fbca2fb0c5b
              segment_index: 3
              size_bytes: 11534336
              limit_bytes: 10485760
        request_id: 9264af56-01cc-4fbe-9560-8df51ef3f668

    TaskStatusValue:
      type: string
      enum: [queued, running, done, failed]
    TaskType:
      type: string
      enum: [upload, delete, publish, update, retry, match]
    TaskPhase:
      type: string
      enum:
        - receiving
        - waiting_for_seal
        - validating
        - splitting
        - persisting
        - analyzing
        - publishing
        - updating
        - retrying
        - deleting
        - matching
        - notifying
        - finished
    MediaType:
      type: string
      enum: [image, video]
    ReviewStatus:
      type: string
      enum: [pending_review, published, deleted]
    UserId:
      type: string
      minLength: 1
      maxLength: 191
      description: 前端业务用户标识；用于素材归属与数据范围，不是鉴权凭据。
    NullableUserId:
      description: null 或空字符串表示公共素材；服务端会把空字符串规范化为 null。
      oneOf:
        - { $ref: "#/components/schemas/UserId" }
        - { type: string, const: "" }
        - { type: "null" }
      default: null
    CallbackUrl:
      oneOf:
        - type: string
          format: uri
          maxLength: 2048
          pattern: '^https?://'
        - type: "null"
      default: null

    CompatibilityMatchRequest:
      type: object
      additionalProperties: true
      required: [asr, llm, callback_url]
      properties:
        asr:
          description: 可传 ASR transcripts；LLM segments 已带时间轴时也可传空对象。
          type: object
          additionalProperties: true
          properties:
            transcripts:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: true
                required: [sentences]
                properties:
                  sentences:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: true
                      required: [text, words]
                      properties:
                        text: { type: string }
                        words:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            additionalProperties: true
                            required: [text, begin_time, end_time]
                            properties:
                              text: { type: string }
                              begin_time: { type: integer, minimum: 0 }
                              end_time: { type: integer, minimum: 0 }
                              punctuation: { type: string }
        llm:
          description: 包含 segments 数组的 JSON 字符串，也兼容直接传对象。
          oneOf:
            - { type: string }
            - type: object
              additionalProperties: true
              required: [segments]
              properties:
                segments:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: object
                    additionalProperties: true
                    required: [segment_id, text, level]
                    properties:
                      segment_id: { type: integer, minimum: 1 }
                      text: { type: string, minLength: 1 }
                      high_light_word: { type: string }
                      keyword: { type: string }
                      level: { type: integer, minimum: 0 }
                      group_id:
                        type: array
                        minItems: 2
                        maxItems: 2
                        prefixItems:
                          - { type: number }
                          - { type: number }
                      start_time: { type: number }
                      end_time: { type: number }
        text: { type: string }
        asset_url_list:
          type: array
          default: []
          items:
            oneOf:
              - { type: string, format: uri }
              - type: object
                additionalProperties: true
                required: [file_url, type]
                properties:
                  file_url: { type: string, format: uri }
                  type: { type: string }
        callback_url:
          type: string
          format: uri
          pattern: '^https?://'

    CompatibilityMatchAccepted:
      type: object
      additionalProperties: false
      required: [taskId, status]
      properties:
        taskId: { type: string, format: uuid }
        status: { type: string, const: processing }

    CompatibilityMatchSegment:
      type: object
      additionalProperties: true
      required:
        [segment_id, text, keyword, level, group_id, start_time, end_time,
         matched_candidate_url, matched_candidate_type, matched_candidate_desc,
         matched_candidate_score, matched_candidate_reason,
         matched_candidate_message]
      properties:
        segment_id: { type: integer, minimum: 1 }
        text: { type: string }
        keyword: { type: string }
        level: { type: integer, minimum: 0 }
        group_id:
          type: array
          minItems: 2
          maxItems: 2
          prefixItems:
            - { type: integer, minimum: 1 }
            - { type: integer, minimum: 1 }
        start_time: { type: number, minimum: 0 }
        end_time: { type: number, minimum: 0 }
        matched_candidate_url:
          oneOf:
            - { type: string, format: uri }
            - { type: "null" }
        matched_candidate_type:
          oneOf:
            - { $ref: "#/components/schemas/MediaType" }
            - { type: "null" }
        matched_candidate_desc:
          oneOf:
            - { type: string }
            - { type: "null" }
        matched_candidate_score:
          description: 命中分数；未命中但存在低分候选时为阈值过滤前最高分。
          oneOf:
            - { type: number, minimum: 0, maximum: 1 }
            - { type: "null" }
        matched_candidate_reason:
          description: 命中时为 null；未命中时说明原因。
          oneOf:
            - type: string
              enum: [no_candidates, below_threshold, semantic_unavailable,
                     fallback_exhausted]
            - { type: "null" }
        matched_candidate_message:
          description: 命中时为 null；未命中时为可直接展示的说明。
          oneOf:
            - { type: string }
            - { type: "null" }

    CompatibilityMatchCallback:
      type: object
      additionalProperties: true
      required: [taskId, status, completed_at]
      properties:
        taskId: { type: string, format: uuid }
        status: { type: string, enum: [success, failed] }
        result:
          type: object
          additionalProperties: false
          required: [segments]
          properties:
            segments:
              type: array
              items: { $ref: "#/components/schemas/CompatibilityMatchSegment" }
        error: { $ref: "#/components/schemas/ApiError" }
        completed_at: { type: string }
